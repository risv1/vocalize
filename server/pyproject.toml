[project]
name = "vocalize-server"
version = "0.1.0"
description = "Self-hosted TTS + LLM server for the Vocalize browser extension"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "trafilatura>=1.12",
    "anthropic>=0.39",
    "openai>=1.54",
    "google-genai>=0.3",
]

[project.optional-dependencies]
# Default TTS path: the official Kokoro package (PyTorch, pulls weights
# from the HF Hub on first use — no manual model download needed).
kokoro = [
    "kokoro>=0.9.2",
]
# Generic Hugging Face TTS repo ids (non-Kokoro) and the huggingface LLM
# provider both go through transformers directly.
huggingface = [
    "transformers>=4.46",
    "torch>=2.5",
    "accelerate>=1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalize_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends(...) idiom relies on function calls as defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
